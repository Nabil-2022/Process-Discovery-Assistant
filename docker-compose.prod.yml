services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${PDA_PUBLIC_APP_URL:-http://process.higroup.systems}
      FRONTEND_URL: ${PDA_PUBLIC_APP_URL:-http://process.higroup.systems}
      CORS_ORIGIN: ${PDA_CORS_ORIGIN:-http://process.higroup.systems,http://197.153.60.68}
      API_URL: ${PDA_PUBLIC_API_URL:-http://197.153.60.68:8050/api/v1}
      DATABASE_URL: 'postgresql://process_discovery:process_discovery@postgres:5432/process_discovery_local?schema=process_discovery'
      DIRECT_DATABASE_URL: 'postgresql://process_discovery:process_discovery@postgres:5432/process_discovery_local?schema=process_discovery'
      COOKIE_DOMAIN: ''
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
      ENABLE_SWAGGER: 'false'
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: processdiscovery
      STORAGE_SECRET_KEY: processdiscovery
      STORAGE_BUCKET: process-discovery-exports
      STORAGE_LOCAL_PATH: /app/storage/exports
      LOCAL_AUTH_BYPASS: 'false'
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      SEED_SUPER_ADMIN_EMAIL: super.admin@example.test
      SEED_SUPER_ADMIN_PASSWORD: ChangeMe12345!
      SEED_MAP_TENANT_ADMIN_EMAIL: tenant.admin@example.test
      SEED_MAP_TENANT_ADMIN_PASSWORD: ChangeMe12345!
    volumes:
      - exports_data:/app/storage/exports
    ports:
      - '8050:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/api/v1/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${PDA_PUBLIC_API_URL:-http://197.153.60.68:8050/api/v1}
    ports:
      - '80:80'
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  exports_data:
