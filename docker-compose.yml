services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: process_discovery_local
      POSTGRES_USER: process_discovery
      POSTGRES_PASSWORD: process_discovery
    ports:
      - '127.0.0.1:8051:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U process_discovery -d process_discovery_local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: processdiscovery
      MINIO_ROOT_PASSWORD: processdiscovery
    ports:
      - '127.0.0.1:8052:9000'
      - '127.0.0.1:8053:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - '127.0.0.1:8054:1025'
      - '127.0.0.1:8055:8025'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8025/livez']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
